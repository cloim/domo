services:
  db:
    image: postgres:17-alpine
    container_name: domo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: domo
      POSTGRES_PASSWORD: ${DOMO_DB_PASSWORD:-domo}
      POSTGRES_DB: domo
      TZ: Asia/Seoul
    ports:
      - "5434:5432"
    volumes:
      - domo-pg:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    image: domo-app:latest
    container_name: domo-app
    restart: unless-stopped
    network_mode: host
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOST=127.0.0.1
      - PORT=4300
      - DATABASE_URL=postgres://domo:${DOMO_DB_PASSWORD:-domo}@127.0.0.1:5434/domo
      - WEB_DIST=/app/apps/web/dist
      - TZ=Asia/Seoul
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:4300/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  domo-pg:
